name: MEDIABOX-Lab — Build do site

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Procfile'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: mediabox-lab-website-build
  cancel-in-progress: true

jobs:
  build:
    name: Validar e empacotar o site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar sintaxe Python
        run: python -m compileall -q .

      - name: Teste de inicialização e rotas essenciais
        env:
          MEDIABOX_SECRET_KEY: github-actions-test-key-not-for-production
          MEDIABOX_STORAGE_DIR: ${{ runner.temp }}/mediabox-test-media
          PORT: '5000'
        run: |
          python - <<'PY'
          from main import app

          app.config.update(TESTING=True)
          client = app.test_client()

          checks = [
              ("/", 200),
              ("/matematica", 200),
              ("/captcha/novo", 200),
          ]

          for path, expected in checks:
              response = client.get(path)
              assert response.status_code == expected, (
                  f"{path}: esperado {expected}, recebido {response.status_code}"
              )
              print(f"OK {path}: HTTP {response.status_code}")

          print("Inicialização e rotas essenciais validadas.")
          PY

      - name: Preparar pacote do site
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          excluded_dirs = {
              ".git", ".github", ".venv", "venv", "__pycache__",
              "media", "logs", "backups", "node_modules"
          }
          excluded_names = {
              ".env", "mediabox_auth.json", "mediabox_session.key",
              "mediabox_admin.sqlite3"
          }
          output = Path("dist/mediabox-lab-website.zip")
          output.parent.mkdir(exist_ok=True)
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in Path(".").rglob("*"):
                  if not path.is_file() or path == output:
                      continue
                  if any(part in excluded_dirs for part in path.parts):
                      continue
                  if path.name in excluded_names or path.suffix in {".pyc", ".log"}:
                      continue
                  archive.write(path, path.as_posix())
          assert output.stat().st_size > 0, "Pacote vazio"
          print(f"Pacote criado: {output} ({output.stat().st_size} bytes)")
          PY

      - name: Publicar artefato da compilação
        uses: actions/upload-artifact@v4
        with:
          name: MEDIABOX-Lab-Website
          path: dist/mediabox-lab-website.zip
          if-no-files-found: error
          retention-days: 14
